<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scranton Pixel Office</title>
<style>
  :root { --floor:#7d9989; --tile:#6c8d7d; --wall:#e9e2de; --ink:#171717; --desk:#b78a4d; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#111; }
  body { min-height:100vh; display:grid; place-items:center; padding:12px; font-family:monospace; }
  .office { width:min(1000px,98vw); aspect-ratio:988/640; position:relative; overflow:hidden; background:var(--wall); border:5px solid var(--ink); box-shadow:0 0 0 2px #d8d1cb inset; image-rendering:pixelated; }
  .floor { position:absolute; left:0; right:0; top:12.5%; bottom:1.4%; background-color:var(--floor); background-image:linear-gradient(90deg,transparent 96%,var(--tile) 96%,var(--tile) 99%,transparent 99%),linear-gradient(0deg,transparent 96%,var(--tile) 96%,var(--tile) 99%,transparent 99%); background-size:78px 58px; }
  .floor:after { content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 50% 50%,#638779 0 3px,transparent 4px); background-size:78px 58px; opacity:.9; }
  .wall { position:absolute; background:#f8f6f1; border:3px solid var(--ink); z-index:5; }
  .window { position:absolute; top:7%; width:4.6%; height:4.2%; background:linear-gradient(90deg,transparent 46%,#242424 46%,#242424 53%,transparent 53%),linear-gradient(0deg,transparent 46%,#242424 46%,#242424 53%,transparent 53%),#b8dce8; border:3px solid #292929; box-shadow:inset 2px 2px #e7f4f7; z-index:3; }
  .plant { position:absolute; width:17px;height:21px;z-index:7;font-size:19px;line-height:18px;filter:drop-shadow(1px 1px #333); }
  .desk { position:absolute; width:7.8%; height:6.2%; background:#b88b4e; border:2px solid #4b3421; z-index:3; box-shadow:inset 0 3px #d5ae70; }
  .desk:before { content:""; position:absolute; left:7%; right:7%; bottom:9%; height:14%; background:#74502c; border:1px solid #392a1b; }
  .monitor { position:absolute; left:30%; top:-40%; width:38%; height:43%; background:#151b2b; border:3px solid #39332e; box-shadow:inset 0 0 0 2px #617486; }
  .monitor:after { content:""; position:absolute; left:36%; bottom:-8px; width:28%; height:5px; background:#c4b7a0; border:1px solid #39332e; }
  .keyboard { position:absolute; width:25%; height:10%; left:37%; bottom:17%; background:#d8d0bd; border:1px solid #4b4439; }
  .mug { position:absolute; width:7px;height:7px; right:9%;bottom:23%; background:#eee7d7;border:1px solid #40372d; }
  .chair { position:absolute; width:2.1%;height:3.6%;background:#9b7441;border:2px solid #493522;border-radius:3px;z-index:2;box-shadow:inset 0 0 0 2px #b99761; }
  .conference { position:absolute; left:28%;top:18.5%;width:18.5%;height:9.3%;background:#b88a4c;border:2px solid #4a3320;z-index:3;box-shadow:inset 0 3px #d5ae70; }
  .conference:before { content:"";position:absolute;left:8%;top:15%;width:7%;height:12%;background:#2c9b59;border:1px solid #28472f; }
  .paper { position:absolute;right:4%;top:10%;width:9%;height:42%;background:#eee5ce;border:1px solid #443b31;transform:rotate(-8deg); }
  .chair-conf { position:absolute;width:2.3%;height:3.8%;background:#914c66;border:2px solid #49313a;z-index:2;box-shadow:inset 0 0 0 2px #b76f85; }
  .cooler { position:absolute;right:1.5%;top:56%;width:7.5%;height:15%;background:#b1f4c9;border:3px solid #273d32;z-index:6;box-shadow:inset 0 0 0 5px #d6ffe4; }
  .cooler:before { content:"";position:absolute;left:23%;top:23%;width:54%;height:54%;background:#0c7654;border:3px solid #214337; }
  .cooler:after { content:"";position:absolute;right:-7px;bottom:9%;width:6px;height:26%;background:#2c3633;border:1px solid #101010; }
  .kitchen { position:absolute;right:3%;bottom:8%;width:18%;height:10%;z-index:3; }
  .counter { position:absolute;left:0;top:28%;width:47%;height:48%;background:#b9b9ad;border:3px solid #363632; }
  .sink { position:absolute;left:15%;top:36%;width:19%;height:25%;background:#e2e5dc;border:2px solid #6e7770; }
  .fridge { position:absolute;left:48%;top:0;width:18%;height:82%;background:#c7c9c6;border:3px solid #525653; }
  .fridge:after { content:"";position:absolute;left:4px;right:4px;top:49%;border-top:2px solid #7b817d; }
  .shelf { position:absolute;right:0;top:0;width:30%;height:82%;background:repeating-linear-gradient(0deg,#b6b9b4 0 7px,#474b48 7px 9px);border:3px solid #535752; }
  .clock { position:absolute;left:1%;top:8%;width:20px;height:20px;border:3px solid #a94343;border-radius:50%;background:#fff;z-index:6; }
  .clock:after { content:"";position:absolute;left:7px;top:2px;width:2px;height:7px;background:#222; }
  .calendar { position:absolute;left:11%;top:4.5%;width:3%;height:6%;background:repeating-linear-gradient(0deg,#eee4c9 0 5px,#d9c8a7 5px 6px);border:2px solid #8c4946;z-index:4; }
  .calendar:before { content:"";position:absolute;left:15%;right:15%;top:-5px;height:5px;background:#9b4845; }
  .agent { position:absolute;width:2.7%;height:6.4%;min-width:17px;min-height:32px;z-index:8;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.2));cursor:pointer; }
  .head { position:absolute;left:18%;top:0;width:64%;height:29%;background:var(--skin,#e9bd91);border:2px solid #342820;z-index:2; }
  .hair { position:absolute;left:10%;top:-5%;width:80%;height:13%;background:var(--hair,#4a3024);border:1px solid #29231f;z-index:3; }
  .face { position:absolute;left:28%;top:12%;width:10%;height:4%;background:#29231f;z-index:4;box-shadow:5px 0 #29231f; }
  .body { position:absolute;left:13%;top:28%;width:74%;height:43%;background:var(--shirt,#344b78);border:2px solid #302b25; }
  .tie { position:absolute;left:44%;top:30%;width:14%;height:27%;background:var(--tie,#b94440);z-index:2; }
  .arm { position:absolute;top:34%;width:18%;height:27%;background:var(--shirt,#344b78);border:1px solid #302b25; }
  .arm.l {left:0}.arm.r{right:0}
  .leg { position:absolute;top:70%;height:25%;width:27%;background:#414746;border:1px solid #242827; }
  .leg.l{left:18%}.leg.r{right:18%}
  .bubble { position:absolute;bottom:105%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid #222;padding:2px 4px;font:bold 10px monospace;color:#171717; }
  .tag { position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #222;padding:1px 3px;font:bold 10px monospace;color:#111;white-space:nowrap; }
  .plant-pot {position:absolute;width:15px;height:9px;background:#c5b7a0;border:2px solid #38342d;z-index:7}
  .plant-pot:before{content:"♣";position:absolute;left:-2px;top:-17px;color:#236f42;font-size:22px}
  @media(max-width:600px){.office{border-width:3px}.floor{background-size:39px 29px}.agent{min-width:11px;min-height:21px}.bubble,.tag{font-size:6px}.wall{border-width:2px}}

/* Character-specific pixel-art silhouettes, desk interaction and activity states */
.agent {
  width: 2.9%;
  height: 7.2%;
  min-width: 18px;
  min-height: 35px;
  transform-origin: 50% 90%;
  transition: filter .2s;
}
.agent .head {
  left: 17%; width: 66%; height: 26%;
  border-radius: 2px;
}
.agent .body { top: 27%; height: 39%; }
.agent .arm { top: 31%; height: 29%; transform-origin: 50% 0; }
.agent .leg { top: 65%; height: 29%; transform-origin: 50% 0; }
.agent .hair {
  left: 8%; width: 84%; height: 12%;
  box-shadow: 0 2px 0 #29231f;
}
/* Unique hair shapes */
.agent[data-name="MICHAEL"] .hair { left: 5%; width: 90%; height: 13%; clip-path: polygon(0 45%,12% 0,25% 22%,40% 0,58% 20%,78% 0,100% 35%,92% 100%,8% 100%); }
.agent[data-name="JIM"] .hair { left: 18%; width: 66%; height: 10%; clip-path: polygon(0 65%,18% 0,62% 0,100% 55%,85% 100%,10% 100%); }
.agent[data-name="DWIGHT"] .hair { left: 7%; width: 86%; height: 14%; clip-path: polygon(0 80%,8% 0,45% 18%,100% 0,93% 100%); }
.agent[data-name="PAM"] .hair { left: 3%; width: 94%; height: 24%; background:#8b4a2e!important; clip-path: polygon(0 0,100% 0,100% 100%,78% 85%,72% 40%,27% 40%,22% 85%,0 100%); }
.agent[data-name="OSCAR"] .hair { left: 13%; width: 74%; height: 10%; clip-path: polygon(0 0,100% 0,86% 100%,15% 100%); }
.agent[data-name="ANGELA"] .hair { left: 0%; width: 100%; height: 18%; background:#c4ad7b!important; clip-path: polygon(0 0,100% 0,92% 100%,75% 75%,25% 75%,8% 100%); }
.agent[data-name="STANLEY"] .hair { left: 13%; width: 74%; height: 8%; background:#27211e!important; }
.agent[data-name="KEVIN"] .head { width: 78%; left: 11%; height: 27%; }
.agent[data-name="KEVIN"] .body { left: 5%; width: 90%; height: 42%; }
.agent[data-name="PHYLLIS"] .hair { left: 1%; width: 98%; height: 19%; background:#a58b70!important; clip-path: polygon(0 0,100% 0,100% 100%,80% 75%,20% 75%,0 100%); }
.agent[data-name="RYAN"] .hair { left: 16%; width: 68%; height: 9%; }
.agent[data-name="TOBY"] .hair { left: 5%; width: 90%; height: 14%; background:#5b4737!important; clip-path: polygon(0 0,100% 0,85% 100%,12% 100%); }
.agent[data-name="CREED"] .hair { left: 0%; width: 100%; height: 18%; background:#aaa99c!important; clip-path: polygon(0 60%,10% 0,28% 40%,43% 0,61% 35%,80% 0,100% 55%,92% 100%,8% 100%); }
/* Distinct body silhouettes */
.agent[data-name="KEVIN"] .body { border-radius: 3px 3px 0 0; }
.agent[data-name="STANLEY"] .body { left: 5%; width: 90%; }
.agent[data-name="ANGELA"] .body { left: 22%; width: 56%; }
.agent[data-name="PAM"] .body { left: 18%; width: 64%; }
.agent[data-name="CREED"] .body { transform: skew(-5deg); }
/* Tiny pixel glasses for Dwight and Stanley */
.agent[data-name="DWIGHT"] .head:after {
  content:""; position:absolute; left:0; top:25%; width:100%; height:30%;
  background:linear-gradient(90deg,transparent 0 7%,#2b2925 7% 42%,transparent 42% 56%,#2b2925 56% 91%,transparent 91%);
  border-top:1px solid #2b2925; border-bottom:1px solid #2b2925;
}
.agent[data-name="STANLEY"] .head:after {
  content:""; position:absolute; left:18%; top:25%; width:64%; height:2px; background:#29231f;
}
/* A desk-facing chair appears directly behind each seated agent */
.agent.seated::before {
  /* Small chair back, not a wide plank under the character */
  content:""; position:absolute; left:18%; top:43%; width:64%; height:20%;
  background:#9b7441; border:2px solid #493522; z-index:-1;
  box-shadow:inset 0 0 0 1px #c2a06b;
}
.agent.seated { height:6.2%; }
.agent.seated .leg { height:22%; top:63%; }
.agent.seated .arm { top:32%; height:31%; animation: typingArms .38s steps(2) infinite alternate; }
.agent.seated .body { top:27%; }
.agent.seated .head { animation: focusedBob 1.8s steps(2) infinite; }
.agent.seated .monitor-glow {
  position:absolute; left:-15%; top:20%; width:130%; height:22%;
  background:rgba(67,190,240,.18); z-index:-2; animation: screenPulse 2.3s ease-in-out infinite;
}
@keyframes typingArms { from { transform:rotate(-9deg) translateY(0); } to { transform:rotate(10deg) translateY(2px); } }
@keyframes focusedBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(1px); } }
@keyframes screenPulse { 0%,100% { opacity:.2; } 50% { opacity:.8; } }
.agent.walking { animation: walkCycle .24s steps(2) infinite; z-index:10; }
.agent.walking .leg.l { animation: legLeft .24s steps(2) infinite alternate; }
.agent.walking .leg.r { animation: legRight .24s steps(2) infinite alternate; }
.agent.walking .arm.l { animation: armLeft .24s steps(2) infinite alternate; }
.agent.walking .arm.r { animation: armRight .24s steps(2) infinite alternate; }
@keyframes walkCycle { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1px); } }
@keyframes legLeft { from { transform:rotate(-13deg); } to { transform:rotate(13deg); } }
@keyframes legRight { from { transform:rotate(13deg); } to { transform:rotate(-13deg); } }
@keyframes armLeft { from { transform:rotate(10deg); } to { transform:rotate(-10deg); } }
@keyframes armRight { from { transform:rotate(-10deg); } to { transform:rotate(10deg); } }
.agent.talking .head { animation: talkBob .24s steps(2) infinite alternate; }
.agent.talking:after {
  content:""; position:absolute; left:100%; top:2%; width:5px; height:5px;
  background:#fff; border:1px solid #222; box-shadow:5px -5px #fff,5px -5px 0 1px #222;
}
.agent .bubble { z-index:15; }
@media(max-width:600px) {
  .agent { min-width:11px; min-height:23px; }
  .agent.seated { min-height:23px; }
}


/* Office navigation + believable workstation furniture */
.desk-chair {
  position:absolute; width:2.6%; height:2.8%; min-width:13px; min-height:10px;
  background:#a17b43; border:2px solid #46321f; z-index:4;
  box-shadow:inset 0 0 0 2px #c6a36a;
}
.desk-chair:after {
  content:""; position:absolute; left:18%; right:18%; bottom:-4px; height:3px;
  background:#493522;
}
.desk .keyboard {
  left:30%; width:36%; bottom:19%; height:13%;
  background:repeating-linear-gradient(90deg,#e2dac7 0 3px,#aaa18d 3px 4px);
}
.desk .mouse {
  position:absolute; right:18%; bottom:15%; width:7%; height:16%;
  background:#ded8c8; border:1px solid #4b4439; border-radius:45%;
}
.agent.seated {
  z-index:6;
  height:7.2%;
}
.agent.seated::before {
  /* Chair sits behind the agent, not as a plank below their feet */
  left:20%; top:38%; width:60%; height:23%;
  background:#9b7441; border:2px solid #493522;
}
.agent.seated .body { top:27%; height:37%; }
.agent.seated .arm { top:39%; height:24%; }
.agent.seated .leg { top:62%; height:26%; }
.agent .tag { pointer-events:none; }
.agent.walking { z-index:9; }


/* Fixed-size sprites and workstation chair alignment */
.agent { box-sizing:border-box; flex:none; }
.agent.walking { transform:translateY(0); }
.agent.seated { transform:translateY(0); }
.agent.seated::before {
  left:25%; top:36%; width:50%; height:22%;
  background:#9b7441; border:2px solid #493522;
  box-shadow:inset 0 0 0 1px #c2a06b;
}
/* Chairs are furniture objects, centered on each desk's keyboard axis */
.desk-chair {
  position:absolute; width:2.6%; height:2.8%; min-width:13px; min-height:10px;
  background:#a17b43; border:2px solid #46321f; z-index:4;
  box-shadow:inset 0 0 0 2px #c6a36a;
}
.desk-chair:after {
  content:""; position:absolute; left:18%; right:18%; bottom:-4px; height:3px;
  background:#493522;
}


/* Visible workstation use: larger powered-on monitors and seated posture */
.desk {
  height:7.1%;
}
.desk .monitor {
  left:23%;
  top:-48%;
  width:54%;
  height:55%;
  background:#080d12;
  border:3px solid #292b2d;
  box-shadow:inset 0 0 0 2px #414b54;
  overflow:hidden;
}
.desk .monitor:before {
  content:"";
  position:absolute; inset:3px;
  background:#080d12;
}
.desk .monitor.on {
  background:#071521;
  box-shadow:inset 0 0 0 2px #8bdcff, 0 0 10px rgba(56,190,255,.65);
}
.desk .monitor.on:before {
  background:
    radial-gradient(ellipse at 50% 35%,rgba(75,210,255,.55),transparent 55%),
    linear-gradient(135deg,#174764,#07131f 65%,#1d5570);
  animation: monitorWake 3s ease-in-out infinite;
}
.desk .monitor:before {
  content:"";
  position:absolute; inset:3px;
  background:#080d12;
}
.desk .monitor:after {
  content:"";
  position:absolute; left:34%; bottom:-8px; width:32%; height:5px;
  background:#c4b7a0; border:1px solid #39332e;
}
.desk .keyboard {
  left:20%; width:43%; bottom:13%; height:15%;
  background:repeating-linear-gradient(90deg,#e2dac7 0 3px,#aaa18d 3px 4px);
}
.desk .mouse {
  right:15%; bottom:10%; width:9%; height:18%;
  background:#ded8c8; border:1px solid #4b4439; border-radius:45%;
}
.desk .mug { right:5%; bottom:20%; }
@keyframes monitorWake {
  0%,100% { filter:brightness(.8); }
  50% { filter:brightness(1.35); }
}
.monitor.on {
  box-shadow:inset 0 0 0 2px #8bdcff, 0 0 10px rgba(56,190,255,.65);
}
.agent.seated {
  height:7.2%;
  transform:translateY(0);
}
.agent.seated .body {
  top:26%; height:37%;
}
.agent.seated .arm {
  top:39%; height:25%;
  animation: typingArms .32s steps(2) infinite alternate;
}
.agent.seated .head {
  animation: focusedBob 1.6s steps(2) infinite;
}
.agent.seated .leg {
  top:62%; height:25%;
}
.agent.seated::before {
  left:24%; top:39%; width:52%; height:21%;
  background:#9b7441; border:2px solid #493522;
}
.agent.working-glance .head { transform:translateY(1px); }
.work-indicator {
  position:absolute; left:50%; top:-20%; transform:translateX(-50%);
  width:4px; height:4px; background:#70e5ff; box-shadow:0 0 5px #70e5ff;
}


/* WORKSTATION POSE: back facing the monitor, seated in the chair, hands on input devices */
.agent.seated {
  height:5.2% !important;
  min-height:27px;
  z-index:7;
  transform:translateY(0) !important;
}
.agent.seated .head {
  left:23%; top:0; width:54%; height:25%;
  background:var(--hair,#4a3024);
  border:2px solid #2b2926;
  box-shadow:inset 0 -3px 0 rgba(255,255,255,.12);
  border-radius:2px;
}
.agent.seated .hair {
  left:8%; top:-6%; width:84%; height:17%;
  background:var(--hair,#4a3024);
  border:1px solid #29231f;
}
.agent.seated .face { display:none !important; }
.agent.seated .body {
  left:18%; top:24%; width:64%; height:36%;
  border-radius:2px 2px 0 0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
}
.agent.seated .tie { display:none; }
.agent.seated .arm {
  top:34%; width:22%; height:25%;
  transform-origin:50% 15%;
  animation: deskTyping .28s steps(2) infinite alternate;
}
.agent.seated .arm.l { left:0; transform:rotate(-35deg); }
.agent.seated .arm.r { right:0; transform:rotate(35deg); }
.agent.seated .leg {
  top:57%; height:24%; width:25%;
  background:#343b3d;
}
.agent.seated .leg.l { left:18%; transform:rotate(-8deg); }
.agent.seated .leg.r { right:18%; transform:rotate(8deg); }
/* Chair is behind the hips, centered on the sprite rather than looking like a plank below it */
.agent.seated::before {
  left:14%; top:35%; width:72%; height:30%;
  box-sizing:border-box;
  background:#8c6338;
  border:2px solid #3d2c1c;
  box-shadow:inset 0 0 0 2px #bd965d, 0 2px 0 #4b3825;
  z-index:-1;
}
/* Small chair seat under the agent's hips */
.agent.seated::after {
  content:"";
  position:absolute; left:9%; top:54%; width:82%; height:12%;
  background:#b38b4f; border:2px solid #3d2c1c;
  box-sizing:border-box; z-index:-1;
}
.desk .monitor { z-index:5; }
.desk .keyboard { z-index:6; }
.desk .mouse { z-index:6; }
@keyframes deskTyping {
  from { margin-top:0; }

}

<script>
const office = document.getElementById('office');
const agents = [
 {name:'MICHAEL',x:6.5,y:17,shirt:'#243b63',hair:'#33251e',skin:'#e9bd91',tie:'#b63e3b',state:'working',deskX:4,deskY:23},
 {name:'JIM',x:37.5,y:30,shirt:'#526f9a',hair:'#4b3023',skin:'#e8bd96',tie:'#d5d0c6',state:'working',deskX:56,deskY:27.5},
 {name:'DWIGHT',x:40,y:30,shirt:'#c49b31',hair:'#32251c',skin:'#e6b98e',tie:'#604b25',state:'working',deskX:65,deskY:27.5},
 {name:'PAM',x:47,y:68,shirt:'#ce789c',hair:'#80502f',skin:'#edc49f',tie:'#a84e76',state:'talking',deskX:50,deskY:55},
 {name:'OSCAR',x:4,y:57,shirt:'#537f73',hair:'#30261f',skin:'#b98461',tie:'#344d4a',state:'working',deskX:2,deskY:55},
 {name:'ANGELA',x:41,y:57,shirt:'#b8b4a4',hair:'#8b7656',skin:'#f0c9a8',tie:'#857f6c',state:'working',deskX:38,deskY:55},
 {name:'STANLEY',x:65,y:57,shirt:'#9d593f',hair:'#29231f',skin:'#8b5d43',tie:'#44352e',state:'working',deskX:50,deskY:55},
 {name:'KEVIN',x:73,y:68,shirt:'#314c6e',hair:'#3b2a22',skin:'#e3b08a',tie:'#b8443b',state:'talking',deskX:62,deskY:79},
 {name:'PHYLLIS',x:75,y:68,shirt:'#b66e87',hair:'#a58b70',skin:'#d6a27d',tie:'#85465b',state:'idle',deskX:62,deskY:79},
 {name:'RYAN',x:78,y:68,shirt:'#6d7e82',hair:'#3b2a22',skin:'#d9aa87',tie:'#3d4c51',state:'walking',deskX:14,deskY:79},
 {name:'TOBY',x:18,y:58,shirt:'#6c7d83',hair:'#554237',skin:'#e2b994',tie:'#6b6c64',state:'working',deskX:14,deskY:55},
 {name:'CREED',x:31,y:69,shirt:'#756d57',hair:'#aaa99c',skin:'#c8a17d',tie:'#595442',state:'idle',deskX:26,deskY:79}
];

function makeAgent(a) {
 const el=document.createElement('div');
 el.className='agent'; el.dataset.name=a.name;
 el.style.left=a.x+'%'; el.style.top=a.y+'%';
 ['shirt','hair','skin','tie'].forEach(k=>el.style.setProperty('--'+k,a[k]));
 el.innerHTML='<span class="hair"></span><span class="head"></span><span class="face"></span><span class="body"></span><span class="tie"></span><span class="arm l"></span><span class="arm r"></span><span class="leg l"></span><span class="leg r"></span><span class="tag">'+a.name+'</span>';
 el.title=a.name+' · '+a.state;
 office.appendChild(el); a.el=el;
 el.addEventListener('click',()=>{
   document.querySelectorAll('.agent').forEach(n=>n.classList.remove('selected'));
   el.classList.add('selected');
   const tag=el.querySelector('.tag'); tag.style.display='block';
   setTimeout(()=>tag.style.display='',1300);
 });
}
function setState(a,state) {
 a.state=state;
 const el=a.el;
 if(!el)return;
 el.classList.remove('seated','walking','talking');
 const old=el.querySelector('.bubble'); if(old)old.remove();
 const glow=el.querySelector('.monitor-glow'); if(glow)glow.remove();

 // Turn off any screen previously associated with this agent.
 const desk=nearestDesk(a);
 const monitor=desk&&desk.querySelector('.monitor');
 if(monitor)monitor.classList.remove('on');

 if(state==='working') {
   el.classList.add('seated');
   const g=document.createElement('span');g.className='monitor-glow';el.appendChild(g);
   // Screen and light come on only after the agent reaches the workstation.
   if(monitor)monitor.classList.add('on');
 }
 if(state==='walking')el.classList.add('walking');
 if(state==='talking') {
   el.classList.add('talking');
   const b=document.createElement('span');b.className='bubble';b.textContent='talking...';el.appendChild(b);
 }
 el.title=a.name+' · '+state;
}
agents.forEach(makeAgent);

/* Navigation is calculated around walls, desks, conference table, cooler and kitchen.
   Agents cannot walk through furniture; they follow open floor tiles instead. */
const GRID=2;
function rectPct(el) {
 const r=el.getBoundingClientRect(), o=office.getBoundingClientRect();
 return {x:(r.left-o.left)/o.width*100,y:(r.top-o.top)/o.height*100,w:r.width/o.width*100,h:r.height/o.height*100};
}
function pointBlocked(x,y) {
 // Keep agents inside the floor and clear of the outer wall.
 if(x<2||x>96||y<14||y>94)return true;
 const blockers=[...office.querySelectorAll('.wall,.desk,.conference,.cooler,.kitchen')];
 return blockers.some(el=>{
   const r=rectPct(el);
   // Leave a small safety margin around solid furniture.
   return x>r.x-1.2 && x<r.x+r.w+1.2 && y>r.y-1.6 && y<r.y+r.h+1.6;
 });
}
function toGrid(x,y){return {x:Math.round(x/GRID),y:Math.round(y/GRID)}}
function toPct(p){return {x:p.x*GRID,y:p.y*GRID}}
function key(p){return p.x+','+p.y}
function findPath(from,to) {
 const start=toGrid(from.x,from.y), goal=toGrid(to.x,to.y);
 const open=[start], came=new Map(), g=new Map([[key(start),0]]), f=new Map([[key(start),Math.abs(start.x-goal.x)+Math.abs(start.y-goal.y)]]);
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 let loops=0;
 while(open.length && loops++<5000) {
   open.sort((a,b)=>(f.get(key(a))??1e9)-(f.get(key(b))??1e9));
   const cur=open.shift(), ck=key(cur);
   if(Math.abs(cur.x-goal.x)<=1 && Math.abs(cur.y-goal.y)<=1) {
     const path=[cur]; let k=ck;
     while(came.has(k)){const prev=came.get(k);path.unshift(prev);k=key(prev);}
     return path.map(toPct);
   }
   for(const [dx,dy] of dirs) {
     const n={x:cur.x+dx,y:cur.y+dy}, p=toPct(n), nk=key(n);
     if(pointBlocked(p.x,p.y) && !(Math.abs(n.x-goal.x)<=1&&Math.abs(n.y-goal.y)<=1))continue;
     const ng=(g.get(ck)??1e9)+1;
     if(ng<(g.get(nk)??1e9)){
       came.set(nk,cur);g.set(nk,ng);f.set(nk,ng+Math.abs(n.x-goal.x)+Math.abs(n.y-goal.y));
       if(!open.some(v=>key(v)===nk))open.push(n);
     }
   }
 }
 return [];
}
function moveAlong(a,path,done) {
 if(!path.length){done?.();return;}
 setState(a,'walking');
 let i=0;
 const step=()=>{
   if(i>=path.length){done?.();return;}
   const p=path[i++];
   // Keep sprite dimensions constant; only update its position.
   a.el.style.left=p.x+'%';
   a.el.style.top=p.y+'%';
   setTimeout(step,75);
 };
 step();
}
function goToDesk(a) {
 // The docking point is centered on the keyboard and chair axis.
 const target={x:a.deskX+3.9-1.45,y:a.deskY+5.1};
 const from={x:parseFloat(a.el.style.left),y:parseFloat(a.el.style.top)};
 const path=findPath(from,target);
 if(!path.length) {
   // Do not fake a seated state if a route could not be found.
   setState(a,'idle');
   return;
 }
 moveAlong(a,path,()=>{
   a.el.style.left=target.x+'%';
   a.el.style.top=target.y+'%';
   setState(a,'working');
 });
}
function takeBreak(a) {
 const from={x:parseFloat(a.el.style.left),y:parseFloat(a.el.style.top)};
 const target={x:Math.min(94,from.x+8),y:Math.min(90,from.y+5)};
 const path=findPath(from,target);
 moveAlong(a,path,()=>setState(a,'idle'));
}
function talk(a,b) {
 if(a.state==='walking'||b.state==='walking')return;
 const oldA=a.state,oldB=b.state;
 const ax=parseFloat(a.el.style.left), ay=parseFloat(a.el.style.top);
 const bx=parseFloat(b.el.style.left), by=parseFloat(b.el.style.top);
 // Only start a chat if they're near one another or can reach each other on walkable floor.
 const mid={x:(ax+bx)/2,y:(ay+by)/2};
 const p1=findPath({x:ax,y:ay},{x:mid.x-2,y:mid.y});
 const p2=findPath({x:bx,y:by},{x:mid.x+2,y:mid.y});
 if(!p1.length||!p2.length)return;
 moveAlong(a,p1,()=>setState(a,'talking'));
 moveAlong(b,p2,()=>setState(b,'talking'));
 setTimeout(()=>{
   setState(a,oldA==='working'?'working':'idle');
   setState(b,oldB==='working'?'working':'idle');
 },3600);
}


function nearestDesk(a) {
 const desks=[...office.querySelectorAll('.desk')];
 let best=null,dist=Infinity;
 for(const d of desks) {
   const r=rectPct(d), cx=r.x+r.w/2, cy=r.y+r.h/2;
   const dd=Math.hypot(cx-(a.deskX+3.9),cy-(a.deskY+3.5));
   if(dd<dist){dist=dd;best=d;}
 }
 return best;
}

// Start work-ready agents seated at their own workstation, centered with the monitor/keyboard.
agents.forEach((a,i)=>{
 if(a.state==='working') {
   const target={x:a.deskX+3.9-1.45,y:a.deskY+5.1};
   const path=findPath({x:a.x,y:a.y},target);
   if(path.length) {
     moveAlong(a,path,()=>{
       a.el.style.left=target.x+'%';
       a.el.style.top=target.y+'%';
       setState(a,'working');
       const desk=nearestDesk(a);
       if(desk) {
         const monitor=desk.querySelector('.monitor');
         if(monitor)monitor.classList.add('on');
       }
     });
   } else {
     a.el.style.left=target.x+'%';
     a.el.style.top=target.y+'%';
     setState(a,'working');
   }
 } else if(a.name==='RYAN') {
   setTimeout(()=>takeBreak(a),2400);
 }
});

// Random walk uses only pathfinding, then agents return to a desk via a walkable route.
// Agents remain at their workstations by default. No random wandering loop.

// Short conversations are only attempted if a walkable route exists.

// Conversations are triggered only when agents are already idle, never by pulling someone from a desk.
setInterval(()=>{
 const idle=agents.filter(a=>a.state==='idle');
 if(idle.length>=2) talk(idle[0],idle[1]);
},14000);
</script>
