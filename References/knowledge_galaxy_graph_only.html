<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e5e7eb; }
  #graph { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  
  #panel {
    position: fixed; top: 0; right: -420px; width: 400px; height: 100%;
    background: rgba(10, 10, 20, 0.95);
    border-left: 1px solid rgba(120, 120, 255, 0.3);
    backdrop-filter: blur(12px);
    padding: 24px; overflow-y: auto;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
  }
  #panel.open { right: 0; }
  @media (max-width: 600px) { #panel { width: min(88vw, 400px); } }
  #panel h2 { font-size: 20px; margin-bottom: 8px; color: #a5b4fc; }
  #panel .group { font-size: 12px; color: #6b7280; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  #panel .excerpt { font-size: 14px; line-height: 1.6; color: #d1d5db; white-space: pre-wrap; }
  #panel .close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #9ca3af; font-size: 24px; cursor: pointer; }
  #panel .close:hover { color: #fff; }
  #panel .neighbors { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
  #panel .neighbors h3 { font-size: 13px; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  #panel .neighbors a { display: block; color: #818cf8; font-size: 13px; margin: 4px 0; cursor: pointer; }
  #panel .neighbors a:hover { color: #c7d2fe; }
#loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #6b7280; font-size: 14px; z-index: 3; text-align: center;
  }
</style>
</head>
<body>

<div id="graph"></div>
<div id="loading">Initializing galaxy…<br><span style="font-size:12px; color:#4b5563; margin-top:8px; display:block;">(If this stays black, WebGL might be disabled in your browser)</span></div>
<div id="panel">
  <button class="close" onclick="closePanel()">×</button>
  <h2 id="panelTitle"></h2>
  <div class="group" id="panelGroup"></div>
  <div class="excerpt" id="panelExcerpt"></div>
  <div class="neighbors" id="panelNeighbors"></div>
</div>
<!-- Pin the exact versions that work together -->
<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.43.0/dist/3d-force-graph.min.js"></script>

<script>
// ─── Sample data ────────────────────────────────────────────────────────────
const GRAPH = {
  nodes: [
    { id: 0, label: "Project Alpha", group: "projects", excerpt: "Project Alpha is a full-stack web application built with React and Node.js. It handles user authentication, payment processing, and real-time notifications." },
    { id: 1, label: "Meeting Notes Jan", group: "meetings", excerpt: "Discussed Q1 roadmap with the team. Key decisions: prioritize mobile app, delay analytics dashboard to Q2. Sarah will lead the mobile initiative." },
    { id: 2, label: "React Patterns", group: "learning", excerpt: "Notes on React patterns: compound components, render props, custom hooks, context providers." },
    { id: 3, label: "Database Design", group: "learning", excerpt: "PostgreSQL database design notes. Normalization rules, indexing strategies, query optimization." },
    { id: 4, label: "Client Feedback", group: "meetings", excerpt: "Client feedback from Acme Corp: they love the new dashboard but want dark mode. Also requesting CSV export for reports." },
    { id: 5, label: "Project Beta", group: "projects", excerpt: "Project Beta is an internal tool for tracking employee onboarding. Built with Vue.js and Firebase." },
    { id: 6, label: "API Design", group: "learning", excerpt: "REST API design principles: use nouns for resources, HTTP verbs for actions, proper status codes." },
    { id: 7, label: "Sprint Planning", group: "meetings", excerpt: "Sprint 14 planning. Committed to 8 stories: user profile page, password reset flow, email templates." },
    { id: 8, label: "CSS Tricks", group: "learning", excerpt: "CSS techniques collection: grid template areas for layout, clamp() for responsive typography, container queries." },
    { id: 9, label: "Architecture Decisions", group: "learning", excerpt: "ADR log: chose PostgreSQL over MongoDB for transactional consistency. Chose Redis for session storage." }
  ],
  links: [
    { source: 0, target: 6 }, { source: 0, target: 3 }, { source: 1, target: 7 },
    { source: 1, target: 4 }, { source: 2, target: 8 }, { source: 3, target: 9 },
    { source: 5, target: 0 }, { source: 6, target: 9 }, { source: 7, target: 1 },
    { source: 8, target: 2 }, { source: 9, target: 3 }, { source: 4, target: 0 }
  ]
};

let Graph;
const neighborsMap = {};

function groupColor(group) {
  const colors = { projects: "#818cf8", meetings: "#f472b6", learning: "#34d399", default: "#a78bfa" };
  return colors[group] || colors.default;
}

function init() {
  const container = document.getElementById("graph");
  const loading = document.getElementById("loading");

  if (typeof ForceGraph3D === "undefined" || typeof THREE === "undefined") {
    loading.innerHTML = "Unable to load the 3D libraries.<br>Please check your internet connection or disable your CDN/ad blocker for this file.";
    return;
  }

  try {
    GRAPH.links.forEach(l => {
      const s = typeof l.source === "object" ? l.source.id : l.source;
      const t = typeof l.target === "object" ? l.target.id : l.target;
      (neighborsMap[s] = neighborsMap[s] || new Set()).add(t);
      (neighborsMap[t] = neighborsMap[t] || new Set()).add(s);
    });

    // Give the graph a definite size before creating the WebGL renderer.
    const width = Math.max(container.clientWidth, window.innerWidth);
    const height = Math.max(container.clientHeight, window.innerHeight);
    container.style.width = width + "px";
    container.style.height = height + "px";

    Graph = ForceGraph3D()(container)
      .width(width)
      .height(height)
      .graphData(GRAPH)
      .backgroundColor("#000000")
      .showNavInfo(true)
      .nodeLabel(n => n.label)
      .nodeColor(n => groupColor(n.group))
      .nodeVal(8)
      .nodeOpacity(1)
      .nodeResolution(16)
      .linkColor(() => "rgba(120, 120, 255, 0.55)")
      .linkWidth(1)
      .linkDirectionalParticles(2)
      .linkDirectionalParticleWidth(1.2)
      .linkDirectionalParticleColor(() => "#818cf8")
      .onNodeClick(handleNodeClick);

    // Start the graph with a clear camera distance.
    Graph.cameraPosition({ x: 0, y: 0, z: 350 });

    // Keep the renderer correctly sized if the browser window changes.
    window.addEventListener("resize", () => {
      const w = Math.max(container.clientWidth, window.innerWidth);
      const h = Math.max(container.clientHeight, window.innerHeight);
      Graph.width(w).height(h);
    });

    // Add a subtle starfield after the renderer has created its scene.
    const scene = Graph.scene();
    const starGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(1200 * 3);
    for (let i = 0; i < 1200; i++) {
      const r = 800 + Math.random() * 1200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    scene.add(new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.7 })
    ));

    // Hide the loading overlay only after successful graph creation.
    loading.style.display = "none";
  } catch (err) {
    loading.innerHTML = "3D graph error: " + String(err.message || err) +
      "<br>Try opening this file in the latest Chrome with hardware acceleration enabled.";
    console.error("Knowledge Galaxy initialization failed:", err);
  }
}

function handleNodeClick(node) {
  const pos = { x: node.x || 0, y: node.y || 0, z: node.z || 0 };
  const dist = 120;
  const r = Math.hypot(pos.x, pos.y, pos.z) || 1;
  const ratio = 1 + dist / r;
  Graph.cameraPosition(
    { x: pos.x * ratio, y: pos.y * ratio, z: pos.z * ratio },
    pos,
    1200
  );

  const neighbors = neighborsMap[node.id] || new Set();
  Graph.nodeColor(n => {
    if (n.id === node.id) return "#ffffff";
    if (neighbors.has(n.id)) return groupColor(n.group);
    return "rgba(80, 80, 100, 0.25)";
  });
  Graph.linkColor(l => {
    const s = typeof l.source === "object" ? l.source.id : l.source;
    const t = typeof l.target === "object" ? l.target.id : l.target;
    if (s === node.id || t === node.id) return "rgba(120, 120, 255, 0.9)";
    return "rgba(60, 60, 80, 0.08)";
  });

  showPanel(node, neighbors);
}

function showPanel(node, neighbors) {
  document.getElementById("panelTitle").textContent = node.label;
  document.getElementById("panelGroup").textContent = node.group || "unknown";
  document.getElementById("panelExcerpt").textContent = node.excerpt || "(no excerpt)";
  const list = [...neighbors].map(id => GRAPH.nodes[id]);
  const div = document.getElementById("panelNeighbors");
  if (list.length) {
    div.innerHTML = "<h3>Connected</h3>" +
      list.map(n => `<a onclick="handleNodeClick(GRAPH.nodes[${n.id}])">${n.label}</a>`).join("");
  } else {
    div.innerHTML = "";
  }
  document.getElementById("panel").classList.add("open");
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  if (!Graph) return;
  Graph.nodeColor(n => groupColor(n.group));
  Graph.linkColor(() => "rgba(120, 120, 255, 0.35)");
}


// Run when DOM is ready
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', init, { once: true });
} else {
  init();
}
</script>
</body>
</html>
